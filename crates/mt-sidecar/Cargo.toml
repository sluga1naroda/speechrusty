[package]
name = "sr-mt-sidecar"
version.workspace = true
edition.workspace = true

# Separate process: llama.cpp and whisper.cpp each carry their own copy of ggml
# and cannot be linked into a single binary.
[[bin]]
name = "speechrusty-mt"
path = "src/main.rs"

[dependencies]
sr-mt.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["vulkan"] }
